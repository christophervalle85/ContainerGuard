name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://containerguard:containerguard_local@127.0.0.1:5433/containerguard
      TEST_DATABASE_URL: postgresql+psycopg://containerguard_test:containerguard_test_local@127.0.0.1:5434/containerguard_test
      REDIS_URL: redis://127.0.0.1:6380/0
      TEST_REDIS_URL: redis://127.0.0.1:6381/0
    # Docker Official Images on ECR Public avoid Docker Hub pull limits in CI.
    services:
      db:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: containerguard
          POSTGRES_USER: containerguard
          POSTGRES_PASSWORD: containerguard_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U containerguard -d containerguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      test-db:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: containerguard_test
          POSTGRES_USER: containerguard_test
          POSTGRES_PASSWORD: containerguard_test_local
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U containerguard_test -d containerguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      test-redis:
        image: public.ecr.aws/docker/library/redis:8.2-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.21"

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Apply database migrations
        run: |
          uv run --locked alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run --locked alembic upgrade head

      - name: Run tests
        run: uv run --locked pytest
