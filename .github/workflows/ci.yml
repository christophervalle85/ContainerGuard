name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://containerguard:containerguard_local@127.0.0.1:5433/containerguard
      TEST_DATABASE_URL: postgresql+psycopg://containerguard_test:containerguard_test_local@127.0.0.1:5434/containerguard_test
      REDIS_URL: redis://127.0.0.1:6380/0
      TEST_REDIS_URL: redis://127.0.0.1:6381/0
    # Docker Official Images on ECR Public avoid Docker Hub pull limits in CI.
    services:
      db:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: containerguard
          POSTGRES_USER: containerguard
          POSTGRES_PASSWORD: containerguard_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U containerguard -d containerguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      test-db:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: containerguard_test
          POSTGRES_USER: containerguard_test
          POSTGRES_PASSWORD: containerguard_test_local
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U containerguard_test -d containerguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      test-redis:
        image: public.ecr.aws/docker/library/redis:8.2-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.21"

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Apply database migrations
        run: |
          uv run --locked alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run --locked alembic upgrade head

      - name: Run tests
        run: uv run --locked pytest


  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Run component and API tests
        run: npm test

      - name: Build dashboard
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser workflows
        run: npm run test:e2e

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository and reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-verified security tools
        run: |
          bash scripts/install_security_tools.sh "$RUNNER_TEMP/security-bin"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      - name: Scan reachable history for secrets
        run: gitleaks git . --config security/gitleaks.toml --redact=100 --no-banner

      - name: Scan locked dependencies and apply vulnerability gate
        run: >-
          python3 -m scripts.scan_security --kind filesystem --input . --target .
          --expected-target uv.lock --expected-target frontend/package-lock.json
          --output-dir security-reports/dependencies

      - name: Retain validated dependency reports
        if: ${{ !cancelled() && hashFiles('security-reports/dependencies/summary.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security
          path: security-reports/dependencies/*.json
          retention-days: 7
          if-no-files-found: error

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install checksum-verified security tools
        run: |
          bash scripts/install_security_tools.sh "$RUNNER_TEMP/security-bin"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      - name: Build runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          context=.
          if [ "$SERVICE" = frontend ]; then context=frontend; fi
          docker build --platform linux/amd64 -f "Dockerfile.$SERVICE" -t "containerguard-$SERVICE:security" "$context"

      - name: Scan runtime image and apply vulnerability gate
        env:
          SERVICE: ${{ matrix.service }}
        run: >-
          python3 -m scripts.scan_security --kind image
          --input "containerguard-$SERVICE:security" --target "containerguard-$SERVICE:security"
          --output-dir "security-reports/$SERVICE"

      - name: Retain validated runtime reports
        if: ${{ !cancelled() && hashFiles(format('security-reports/{0}/summary.json', matrix.service)) != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-security-${{ matrix.service }}
          path: security-reports/${{ matrix.service }}/*.json
          retention-days: 7
          if-no-files-found: error
