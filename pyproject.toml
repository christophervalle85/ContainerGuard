[project]
name = "containerguard"
version = "0.1.0"
description = "Container vulnerability scanning and security policy evaluation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<8",
    "rq>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx2", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
