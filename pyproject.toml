[project]
name = "containerguard"
version = "0.1.0"
description = "Container vulnerability scanning and security policy evaluation"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
