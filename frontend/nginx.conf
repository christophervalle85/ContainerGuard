server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS must be queried again when the API gets a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }
    location ^~ /api/ {
        set $api_backend api:8000;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_intercept_errors off;
    }

    # Missing assets are errors, not the application's HTML document.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|css|map|json|png|jpg|jpeg|svg|ico|webp|woff2?|ttf|txt|webmanifest)$ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
