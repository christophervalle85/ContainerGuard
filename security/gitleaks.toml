title = "ContainerGuard secret scanning"

[extend]
useDefault = true

[[rules]]
id = "duffel-api-token"
[[rules.allowlists]]
description = "Exact public dependency code, checksums and embedded detector examples"
regexTarget = "secret"
regexes = [
  "^duffel_test_duffel_live_FLWSECK_TESTshippo_live_shippo_$",
]

