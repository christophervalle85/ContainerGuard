name: containerguard

services:
  frontend:
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 64
    image: containerguard-frontend:dev
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    image: containerguard-api:dev
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    environment:
      MAX_ACTIVE_SCANS: ${MAX_ACTIVE_SCANS:-20}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL}
      REDIS_URL: ${CONTAINER_REDIS_URL:?Set CONTAINER_REDIS_URL}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    image: containerguard-worker:dev
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    stop_grace_period: 650s
    environment:
      MAX_ACTIVE_SCANS: ${MAX_ACTIVE_SCANS:-20}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL}
      REDIS_URL: ${CONTAINER_REDIS_URL:?Set CONTAINER_REDIS_URL}
      RQ_WORKER_NAME: containerguard-worker
    volumes:
      - trivy_cache:/var/cache/trivy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.health"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 10s

  migrate:
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    image: containerguard-api:dev
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      MAX_ACTIVE_SCANS: ${MAX_ACTIVE_SCANS:-20}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 64
    image: redis:8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-db:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_DB: containerguard_test
      POSTGRES_USER: containerguard_test
      POSTGRES_PASSWORD: containerguard_test_local
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-redis:
    image: redis:8.2-alpine
    profiles: [test]
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-6381}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  trivy_cache:
